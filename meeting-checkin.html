<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CNIDARIA · Meeting Check-in</title><style>body{background:#081e28;color:#ecfff7;font:16px system-ui;max-width:600px;margin:30px auto;padding:16px}section{background:#103440;padding:20px;border-radius:16px;margin:16px 0}button,input,select{font:inherit;padding:12px;border-radius:9px;margin:5px}button{background:#70e3ad;border:0;color:#052c20;font-weight:bold}input{max-width:90%}small{color:#a6c9c2}#result{white-space:pre-wrap}</style></head><body><a style="color:#70e3ad" href="./">← CNIDARIA</a><h1>Lock to Meet 🦑</h1><p>Check-in interface prototype · No real GPS, Bluetooth, BSV deposits or CNT minting.</p><section><h2>Meeting</h2><label>Meeting ID <input id="meeting" placeholder="e.g. lunch-123" maxlength="80"></label><p><label>Participant <select id="who"><option value="alice">Alice</option><option value="bob">Bob</option></select></label></p><button id="join">Join demo meeting</button></section><section><h2>Proof of presence</h2><p><small>These toggles simulate independent signals. Checking them is not proof of a real meeting.</small></p><p><label><input type="checkbox" id="gps"> Location signal (simulated)</label></p><p><label><input type="checkbox" id="near"> Proximity signal (simulated)</label></p><button id="check">Submit demo check-in</button><button id="cancel">Cancel demo meeting</button><p id="result" role="status">Create or join a demo meeting.</p></section><script type="module">
import {createLedger,createMeeting,simulateDeposit,simulateCheckIn,cancelMeeting} from './cnt-core.mjs';
const l=createLedger();const $=id=>document.getElementById(id);let active='';
$('join').onclick=()=>{try{const id=$('meeting').value.trim();if(!l.commitments[id]){createMeeting(l,{meetingId:id,inviter:'alice',invitee:'bob',sats:10000,deadline:Date.now()+3600000});simulateDeposit(l,id,'alice');simulateDeposit(l,id,'bob')}active=id;$('result').textContent='Meeting '+id+' ready (simulated deposits only).'}catch(e){$('result').textContent=e.message}};
$('check').onclick=()=>{try{if(!active)throw Error('Join a meeting first');const m=simulateCheckIn(l,active,$('who').value,Date.now(),{locationVerified:$('gps').checked,proximityVerified:$('near').checked});$('result').textContent=JSON.stringify({status:m.status,checkedIn:m.checkedIn,settlement:m.settlement},null,2)}catch(e){$('result').textContent=e.message}};
$('cancel').onclick=()=>{try{if(!active)throw Error('Join a meeting first');$('result').textContent=JSON.stringify(cancelMeeting(l,active,$('who').value).settlement,null,2)}catch(e){$('result').textContent=e.message}};
</script></body></html>
