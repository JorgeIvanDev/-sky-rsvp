<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#010603"><title>CNIDARIA — Enter the Game</title>
<style>
:root{color-scheme:dark;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#010603;color:#bcffcf}canvas{position:fixed;inset:0;width:100%;height:100%;display:block}#scan{position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0 3px,#0003 4px 5px);opacity:.5}#shade{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 10%,#010603a0 90%)}main{position:relative;z-index:2;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}section{width:min(100%,480px);padding:28px 22px 30px;border:1px solid #1e6b3b;background:#010b07e8;box-shadow:0 0 90px #00e65b26,0 20px 70px #000b;border-radius:20px;backdrop-filter:blur(5px)}.status{font-size:11px;letter-spacing:.27em;color:#68df8c}.orb{width:112px;height:112px;margin:15px auto 24px;border:1px solid #4afe8b;border-radius:50%;display:grid;place-items:center;box-shadow:0 0 40px #00ff6b44,inset 0 0 25px #00ff6b22;animation:float 3.5s ease-in-out infinite}.orb span{font-size:43px;color:#7dffa3;text-shadow:0 0 25px #00ff66;animation:pulse 2.2s infinite}h1{font-size:clamp(36px,10vw,62px);margin:0;letter-spacing:.11em;text-shadow:0 0 22px #20ff7870}p{line-height:1.55;color:#8dcda5}a,button{display:block;width:100%;border:1px solid #5cff9b;border-radius:12px;padding:18px 14px;margin-top:14px;font:900 17px inherit;letter-spacing:.13em;text-decoration:none;cursor:pointer}a{background:#a3ffbd;color:#00250e;box-shadow:0 0 25px #00ff4a35}button{background:#062014;color:#b3ffce}button:focus-visible,a:focus-visible{outline:3px solid #fff;outline-offset:4px}#opts{display:none;margin-top:12px;padding:12px;border:1px solid #235b37;border-radius:10px}#opts.open{display:block}label{display:block;padding:10px}.foot{font-size:10px;letter-spacing:.12em;margin-top:24px}@keyframes float{50%{transform:translateY(-12px)}}@keyframes pulse{50%{opacity:.45}}@media(prefers-reduced-motion:reduce){.orb,.orb span{animation:none}}

/* Cinematic Natas awakening: no rain before the reveal. */
#rain{opacity:0;transition:opacity .7s ease}body.ready #rain{opacity:0}body.entering #rain{opacity:1}
#scan,#shade{z-index:1}section{position:relative;background:transparent;border-color:transparent;box-shadow:none;backdrop-filter:none;transition:opacity .4s ease}
.orb{transform:scale(.06);opacity:0;animation:awaken 4.2s ease-in-out forwards;filter:drop-shadow(0 0 14px #30ff80)}
.orb span{font-size:43px}h1,.status,section>p,.foot,#start,#options{opacity:0;animation:reveal .6s ease-out 4.3s forwards}
#skip{position:fixed;right:16px;top:calc(14px + env(safe-area-inset-top));z-index:8;width:auto;padding:10px 14px;font-size:12px;background:#001a0bda;border:1px solid #387b4e;opacity:1;animation:none}
#transition{position:fixed;inset:0;z-index:7;pointer-events:none;opacity:0;background:radial-gradient(circle,#28ff7a2b,#000 80%);transition:opacity .5s ease}
body.entering #transition{opacity:1}
body.entering section{opacity:0}
@keyframes awaken{0%{transform:scale(.03) translateY(40px);opacity:0}8%{opacity:.9;transform:scale(.13)}13%{opacity:.2;transform:scale(.06)}20%{opacity:1;transform:scale(.2)}25%{opacity:.3;transform:scale(.11)}33%{opacity:1;transform:scale(.32)}39%{transform:scale(.23)}47%{transform:scale(.53) translateY(10px)}64%{transform:scale(.8)}82%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
@keyframes reveal{to{opacity:1}}
@media(prefers-reduced-motion:reduce){.orb,h1,.status,section>p,.foot,#start,#options{animation:none;opacity:1;transform:none}#rain{display:none}}
/* Abyss-first sequence: ominous accelerated pulses, then friendly reveal */
body{background:#000}#rain{background:#000}
.orb{width:142px;height:142px;border-color:#48ff8b;box-shadow:0 0 34px #1eff6730,inset 0 0 26px #1eff6725;animation:deepPulse 4.4s cubic-bezier(.2,.1,.3,1) both}
.orb span{font-size:64px;filter:blur(5px);animation:creatureFocus 4.4s ease both}
section{padding-top:30px}h1{font-size:clamp(30px,9vw,54px)}
section>p,.status,.foot{display:none}
h1,#start,#options{animation:reveal .55s ease-out 4.5s both}
@keyframes deepPulse{
0%{opacity:0;transform:translateY(90px) scale(.02);filter:blur(20px)}
12%{opacity:.42;transform:translateY(75px) scale(.10);filter:blur(15px)}
16%{opacity:.08;transform:translateY(75px) scale(.055);filter:blur(17px)}
28%{opacity:.58;transform:translateY(60px) scale(.21);filter:blur(12px)}
32%{opacity:.12;transform:translateY(60px) scale(.13);filter:blur(15px)}
42%{opacity:.68;transform:translateY(42px) scale(.35);filter:blur(9px)}
46%{opacity:.18;transform:translateY(42px) scale(.25);filter:blur(12px)}
55%{opacity:.8;transform:translateY(25px) scale(.53);filter:blur(7px)}
59%{opacity:.32;transform:translateY(25px) scale(.42);filter:blur(9px)}
69%{opacity:1;transform:translateY(8px) scale(.78);filter:blur(4px)}
75%{opacity:.64;transform:translateY(8px) scale(.70);filter:blur(5px)}
88%{opacity:1;transform:translateY(-8px) scale(1.08);filter:blur(0)}
100%{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}
}
@keyframes creatureFocus{0%,65%{opacity:.25;filter:blur(9px)}90%,100%{opacity:1;filter:blur(0)}}
@media(prefers-reduced-motion:reduce){.orb,.orb span,h1,#start,#options{animation:none;opacity:1;transform:none;filter:none}}

.natas-creature{width:120px;height:130px;overflow:visible;filter:drop-shadow(0 0 14px #22ff7788);animation:creatureFocus 4.4s ease both}
.natas-creature .face{opacity:0;animation:reveal .4s ease 4s forwards}
.natas-creature .tentacles{transform-origin:80px 99px;animation:drift 2.6s ease-in-out infinite alternate}
@keyframes drift{to{transform:rotate(7deg) translateX(3px)}}
.orb{border:0;box-shadow:0 0 60px #00ff6620,inset 0 0 30px #00ff6612}
@media(prefers-reduced-motion:reduce){.natas-creature,.natas-creature .face,.natas-creature .tentacles{animation:none;opacity:1}}

/* Game appears behind a dissolving digital veil after START */
#game-preview{position:fixed;inset:0;width:100%;height:100%;border:0;z-index:0;opacity:0;pointer-events:none;background:#000;transition:opacity .7s ease .45s}
body.entering #game-preview{opacity:1}
body.entering #rain{z-index:5;opacity:1;animation:rainDissolve 1.9s ease-in forwards}
body.entering #shade,body.entering #scan{opacity:0;transition:opacity .4s}
body.entering #transition{opacity:0}
body.entering #skip{display:none}
@keyframes rainDissolve{0%{opacity:0}30%{opacity:.95}62%{opacity:.8}100%{opacity:0}}
</style></head><body><iframe id="game-preview" title="CNIDARIA game preview" loading="lazy" tabindex="-1" aria-hidden="true"></iframe><canvas id="rain" aria-hidden="true"></canvas><div id="shade"></div><div id="scan"></div><button id="skip" type="button">SKIP INTRO ›</button><div id="transition"></div><main><section><div class="status">● SYSTEM ONLINE · V 1.0</div><div class="orb" aria-hidden="true"><svg class="natas-creature" viewBox="0 0 160 180" role="img" aria-label="Glowing jellyfish mascot concept"><defs><radialGradient id="jelly"><stop stop-color="#baffd2"/><stop offset=".7" stop-color="#45ee91"/><stop offset="1" stop-color="#06864a"/></radialGradient></defs><g class="tentacles" fill="none" stroke="#6effaa" stroke-width="5" stroke-linecap="round"><path d="M43 99 Q29 127 44 150 Q54 166 42 173"/><path d="M66 102 Q54 128 66 153 Q73 167 65 176"/><path d="M92 103 Q107 129 94 153 Q87 168 98 176"/><path d="M116 99 Q130 126 115 151 Q107 165 119 173"/></g><path d="M20 96 C20 46 45 20 80 20 C115 20 140 46 140 96 Q125 111 109 101 Q94 115 80 102 Q65 115 51 101 Q35 111 20 96Z" fill="url(#jelly)" stroke="#c2ffdc" stroke-width="3"/><g class="face"><ellipse cx="61" cy="77" rx="5" ry="7" fill="#002c17"/><ellipse cx="99" cy="77" rx="5" ry="7" fill="#002c17"/><path d="M70 90 Q80 101 90 90" fill="none" stroke="#003d21" stroke-width="3" stroke-linecap="round"/></g></svg></div><h1>CNIDARIA</h1><p>THE GAUNTLET AWAITS.<br>THROW. CATCH. CHALLENGE.</p><a id="start" href="./index.html?play=1">▶ START GAME</a><button id="options" type="button" aria-expanded="false">⚙ OPTIONS</button><div id="opts"><label><input id="motion" type="checkbox"> Reduce animation</label><p>Direct challenge and invitation links still open immediately.</p></div><p class="foot">PRESS START TO ENTER THE GAME</p></section></main>
<script>
(()=>{const c=document.getElementById('rain'),ctx=c.getContext('2d');let cols=[],width=0,height=0,last=0,frame=0;const reduce=document.getElementById('motion');reduce.checked=matchMedia('(prefers-reduced-motion: reduce)').matches;const resize=()=>{width=innerWidth;height=innerHeight;const d=Math.min(devicePixelRatio||1,1.5);c.width=Math.round(width*d);c.height=Math.round(height*d);ctx.setTransform(d,0,0,d,0,0);cols=Array.from({length:Math.ceil(width/18)},()=>Math.random()*height/18)};const draw=t=>{frame=requestAnimationFrame(draw);if(reduce.checked||!document.body.classList.contains("ready")||t-last<55)return;last=t;ctx.fillStyle='rgba(1,6,3,.12)';ctx.fillRect(0,0,width,height);ctx.font='15px monospace';for(let i=0;i<cols.length;i++){ctx.fillStyle=Math.random()>.94?'#bdffd2':'#20b957';ctx.fillText('01CNIDARIA'[Math.floor(Math.random()*10)],i*18,cols[i]*18);cols[i]=cols[i]*18>height&&Math.random()>.96?0:cols[i]+.42+Math.random()*.45}};resize();addEventListener('resize',resize,{passive:true});frame=requestAnimationFrame(draw);reduce.addEventListener('change',()=>{if(reduce.checked)ctx.clearRect(0,0,width,height)});const destination='./index.html?play=1';
const preview=document.getElementById('game-preview');
let previewLoaded=false;
preview.addEventListener('load',()=>{previewLoaded=true});
const enter=()=>{if(document.body.classList.contains('entering'))return;sessionStorage.setItem('cnidaria-intro-seen','1');if(reduce.checked){location.replace(destination);return}
document.body.classList.add('ready','entering');
if(!preview.src||preview.src==='about:blank')preview.src=destination;
setTimeout(()=>location.replace(destination),2100)};
const warmPreview=()=>{if(!preview.getAttribute('src'))preview.src=destination};
setTimeout(warmPreview,2800);
document.getElementById('skip').addEventListener('click',enter);
document.getElementById('start').addEventListener('click',e=>{e.preventDefault();enter()});
if(reduce.checked){document.body.classList.add('ready');document.getElementById('skip').hidden=true}
else setTimeout(()=>{document.getElementById('skip').textContent='SKIP ›'},4400);
document.getElementById('options').addEventListener('click',()=>{const p=document.getElementById('opts');p.classList.toggle('open');document.getElementById('options').setAttribute('aria-expanded',String(p.classList.contains('open')))});})();
</script></body></html>
