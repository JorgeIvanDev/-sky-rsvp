<style>

)}}@keyframes pulse{50%{opacity:.45}}@media(prefers-reduced-motion:reduce){.orb,.orb span{animation:none}}

12%{opacity:.42;transform:translateY(75px) scale(.10);filter:blur(15px)}

/* Natas director's cut: handle on screen-right, head-over-heels flip, delayed eyes and wave. */

@keyframes eyesOpen{from{opacity:0;transform:scaleY(.08);transform-origin:80px 77px}to{opacity:1;transform:scaleY(1)}}

body.short{--intro-length:5.8s}
body.long{--intro-length:10.8s}
@media(prefers-reduced-motion:reduce){.natas-flip{animation:none;transform:rotateX(180deg)}.natas-flip .natas-creature .face,.natas-flip .natas-arm{animation:none;opacity:1}}

/* Director feedback: resolve the logo completely BEFORE the vertical reveal. */

14%{opacity:.2;transform:translateY(60px) scale(.2)}
26%{opacity:.5;transform:translateY(45px) scale(.4)}

@media(prefers-reduced-motion:reduce){.orb{animation:none;opacity:1;transform:none}}

@media(prefers-reduced-motion:reduce){.natas-flip .natas-creature .face{opacity:1}}
/* Final title polish: stable 3D compositing, proper motion accessibility and focus. */

@media(prefers-reduced-motion:reduce){.natas-flip .natas-arm,.natas-flip .tentacles{animation:none!important}.natas-flip .face{opacity:1!important}}
/* Actual CNIDARIA coffee/squid emblem on both sides, no green placeholder. */
.natas-flip .natas-creature{filter:none!important;overflow:visible}
.natas-flip .natas-arm{transform-box:fill-box;transform-origin:85% 22%;animation:logoScratch 1.1s ease-in-out calc(var(--intro-length,10.8s) * .91) 2 alternate both}

@media(prefers-reduced-motion:reduce){.natas-flip .natas-arm{animation:none!important}}

.orb{perspective:900px;transform-style:preserve-3d}
.natas-flip{perspective:none!important;transform-style:preserve-3d!important;-webkit-transform-style:preserve-3d!important;animation:holdThenFlip var(--intro-length,10.8s) linear both!important;transform-origin:50% 50%}
.natas-flip>img,.natas-flip>svg{backface-visibility:hidden!important;-webkit-backface-visibility:hidden!important;transform-style:flat!important;-webkit-transform-style:flat!important}
.natas-flip .natas-coffee{transform:rotateX(0deg) scaleX(-1)!important}

0%,65%{transform:rotateX(0deg)}
72%{transform:rotateX(45deg)}
79%{transform:rotateX(135deg)}
86%,100%{transform:rotateX(180deg)}
}
@media(prefers-reduced-motion:reduce){.natas-flip{animation:none!important;transform:rotateX(180deg)!important}}
/* Match the working in-game logoFlip: rotate ONE emblem, not two opposing faces. */
.natas-flip{animation:none!important;transform:rotateX(0deg)!important;transition:transform .8s cubic-bezier(.2,.7,.2,1)!important;transform-style:preserve-3d!important;perspective:none!important}

/* Abyss glow: light BEHIND the actual monochrome logo, not a bubble. */
.orb{position:relative;isolation:isolate;overflow:visible}
.orb::before{content:"";position:absolute;inset:-72%;z-index:-2;pointer-events:none;border-radius:50%;
background:radial-gradient(circle,rgba(152,255,185,.31) 0%,rgba(45,255,123,.20) 17%,rgba(15,201,87,.09) 34%,transparent 65%);
opacity:0;transform:scale(.45);animation:abyssHeartbeat var(--intro-length,10.8s) ease-out both}
.orb::after{content:"";position:absolute;inset:-22%;z-index:-1;pointer-events:none;border-radius:50%;
background:radial-gradient(circle,rgba(33,255,105,.19),rgba(12,128,52,.04) 46%,transparent 72%);
filter:blur(16px);opacity:0;animation:abyssAfterglow var(--intro-length,10.8s) ease-out both}
.natas-flip{z-index:1}
@keyframes abyssHeartbeat{
0%,8%{opacity:0;transform:scale(.38)}
11%{opacity:.32;transform:scale(.65)}
13%{opacity:.03;transform:scale(.45)}
19%{opacity:.42;transform:scale(.75)}
21%{opacity:.06;transform:scale(.5)}
29%{opacity:.53;transform:scale(.86)}
31%{opacity:.07;transform:scale(.55)}
39%{opacity:.67;transform:scale(1)}
41%{opacity:.12;transform:scale(.65)}
49%{opacity:.75;transform:scale(1.08)}
51%{opacity:.18;transform:scale(.72)}
58%{opacity:.85;transform:scale(1.12)}
61%{opacity:.25;transform:scale(.82)}
68%{opacity:1;transform:scale(1.15)}
72%,100%{opacity:.68;transform:scale(1)}
}
@keyframes abyssAfterglow{0%,35%{opacity:0}60%{opacity:.5}72%,100%{opacity:.85}}
@media(prefers-reduced-motion:reduce){.orb::before,.orb::after{animation:none;opacity:.5;transform:none}}

/* START transition: green glyph curtain falls over title, then reveals the live game. */
#rain{z-index:5;pointer-events:none;opacity:0}
body.entering #rain{opacity:1!important;animation:matrixCurtain 2.6s linear both!important}
body.entering #game-preview{z-index:4;opacity:1;transition:opacity .6s ease .45s}
body.entering main{opacity:0;transition:opacity .35s ease .15s}
@keyframes matrixCurtain{0%{opacity:0}13%{opacity:1}63%{opacity:1}100%{opacity:0}}
@media(prefers-reduced-motion:reduce){body.entering #rain{animation:none!important;opacity:0!important}}
/* Lightweight 2.5D character turn, no 3D dependency or additional downloads. */
.natas-flip{position:relative}
.natas-front{position:absolute;inset:0;width:100%;height:100%;opacity:0;pointer-events:none;transform:rotateX(180deg) rotateY(-72deg) scale(.94);transition:opacity .32s ease,transform .9s cubic-bezier(.16,.75,.22,1)}
.natas-flip.is-facing .natas-coffee{opacity:0;transition:opacity .25s ease}
.natas-flip.is-facing .natas-front{opacity:1;transform:rotateX(180deg) rotateY(0deg) scale(1)}
.natas-front ellipse{transform-box:fill-box;transform-origin:center;animation:natasBlink 5s 2s infinite}
@keyframes natasBlink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.12)}}
@media(prefers-reduced-motion:reduce){.natas-front{transition:none;animation:none}.natas-front ellipse{animation:none}}
/* Repair: legacy hidden-face rule prevented the new two-eye artwork from showing. */
.natas-flip .natas-front{visibility:visible!important;backface-visibility:visible!important;-webkit-backface-visibility:visible!important;z-index:2;transform:rotateX(180deg) rotateY(-72deg) scale(.94)!important;opacity:0}
.natas-flip.is-facing .natas-front{transform:rotateX(180deg) rotateY(0deg) scale(1)!important;opacity:1!important}
.natas-flip.is-facing .natas-coffee{opacity:0!important}
</style></head><body><iframe allow="accelerometer; gyroscope; magnetometer; fullscreen" id="game-preview" title="CNIDARIA game preview" loading="lazy" tabindex="-1" aria-hidden="true"></iframe><canvas id="rain" aria-hidden="true"></canvas><div id="shade"></div><div id="scan"></div><button id="skip" type="button">SKIP INTRO ›</button><div id="transition"></div><main><section><div class="status">● SYSTEM ONLINE · V 1.0</div><div class="orb" aria-hidden="true"><div class="natas-flip"><img class="natas-coffee" src="./assets/cnidaria-original-logo.svg" alt="Original CNIDARIA logo"><svg class="natas-front" viewBox="-18 -14 336 374" aria-hidden="true"><g transform="translate(33 38) scale(.78)"><g fill="none" stroke="#fff" stroke-width="13" stroke-linecap="round"><path d="M114 80c-43 19 37 29-1 52s36 30-2 49"/><path d="M152 80c-43 19 37 29-1 52s36 30-2 49"/><path d="M190 80c-43 19 37 29-1 52s36 30-2 49"/></g><path fill="#fff" d="M87 194h130c21 0 32 15 28 39-6 40-39 72-92 73-47 0-82-31-89-71-5-24 3-41 23-41z"/><ellipse cx="123" cy="232" rx="9" ry="12" fill="#020509"/><ellipse cx="183" cy="232" rx="9" ry="12" fill="#020509"/><path d="M144 260q9 9 18 0" fill="none" stroke="#020509" stroke-width="5" stroke-linecap="round"/><path d="M85 211q-35-19-41 12" fill="none" stroke="#fff" stroke-width="15" stroke-linecap="round"/><path d="M218 211q35-19 41 12" fill="none" stroke="#fff" stroke-width="15" stroke-linecap="round"/></g></svg></div></div><h1>CNIDARIA</h1><p>THE GAUNTLET AWAITS.<br>THROW. CATCH. CHALLENGE.</p><a id="start" href="./index.html?play=1">▶ START GAME</a><button id="options" type="button" aria-expanded="false">⚙ OPTIONS</button><div id="opts"><label><input id="motion" type="checkbox"> Reduce animation</label><p>Direct challenge and invitation links still open immediately.</p></div><p class="foot">PRESS START TO ENTER THE GAME</p></section></main>
<script>
(()=>{const mode=new URLSearchParams(location.search).get('intro');const returning=sessionStorage.getItem('cnidaria-intro-seen')==='1';const short=mode==='short'||(mode!=='long'&&returning);document.body.classList.add(short?'short':'long');const c=document.getElementById('rain'),ctx=c.getContext('2d');let cols=[],width=0,height=0,last=0,frame=0;const reduce=document.getElementById('motion');reduce.checked=matchMedia('(prefers-reduced-motion: reduce)').matches;const resize=()=>{width=innerWidth;height=innerHeight;const d=Math.min(devicePixelRatio||1,1.5);c.width=Math.round(width*d);c.height=Math.round(height*d);ctx.setTransform(d,0,0,d,0,0);cols=Array.from({length:Math.ceil(width/18)},()=>Math.random()*height/18)};const draw=t=>{frame=requestAnimationFrame(draw);if(reduce.checked||!document.body.classList.contains('entering')||t-last<32)return;last=t;ctx.fillStyle='rgba(0,4,1,.23)';ctx.fillRect(0,0,width,height);ctx.font='17px monospace';for(let i=0;i<cols.length;i++){ctx.fillStyle=Math.random()>.82?'#c9ffdb':'#37e981';ctx.fillText('01CNIDARIA'[Math.floor(Math.random()*10)],i*18,cols[i]*18);cols[i]=cols[i]*18>height&&Math.random()>.96?0:cols[i]+1.15+Math.random()*1.15}};resize();addEventListener('resize',resize,{passive:true});frame=requestAnimationFrame(draw);reduce.addEventListener('change',()=>{if(reduce.checked)ctx.clearRect(0,0,width,height)});const destination='./index.html?play=1';
const preview=document.getElementById('game-preview');
const mascot=document.querySelector('.natas-flip');
setTimeout(()=>mascot.classList.add('is-flipped'),short?3950:7450);
setTimeout(()=>mascot.classList.add('is-facing'),short?4900:8500);
const skip=document.getElementById('skip');
skip.setAttribute('aria-label','Skip cinematic introduction and open the game immediately');
let previewLoaded=false;
preview.addEventListener('load',()=>{previewLoaded=true});
const enter=()=>{if(document.body.classList.contains('entering'))return;sessionStorage.setItem('cnidaria-intro-seen','1');if(reduce.checked){location.replace(destination);return}
document.body.classList.add('ready','entering');cols=Array.from({length:Math.ceil(width/18)},(_,i)=>-Math.random()*22-i%7);ctx.clearRect(0,0,width,height);
const start=document.getElementById('start');start.setAttribute('aria-disabled','true');start.style.pointerEvents='none';
if(!preview.src||preview.src==='about:blank')preview.src=destination;
setTimeout(()=>{if(!previewLoaded){location.replace(destination);return}preview.style.pointerEvents='auto';document.getElementById('rain').style.display='none';document.getElementById('transition').style.display='none';document.querySelector('main').style.display='none';document.getElementById('shade').style.display='none';document.getElementById('scan').style.display='none';preview.removeAttribute('aria-hidden');preview.removeAttribute('tabindex');preview.focus()},2700)};
const warmPreview=()=>{if(!preview.getAttribute('src'))preview.src=destination};
setTimeout(warmPreview,short?2500:5400);
skip.addEventListener('click',()=>{sessionStorage.setItem('cnidaria-intro-seen','1');location.replace(destination)});
document.getElementById('start').addEventListener('click',e=>{e.preventDefault();enter()});
if(reduce.checked){document.body.classList.add('ready');document.getElementById('skip').hidden=true}
else setTimeout(()=>{document.getElementById('skip').textContent='SKIP ›'},short?5800:10800);
document.getElementById('options').addEventListener('click',()=>{const p=document.getElementById('opts');p.classList.toggle('open');document.getElementById('options').setAttribute('aria-expanded',String(p.classList.contains('open')))});})();
</script></body></html>
