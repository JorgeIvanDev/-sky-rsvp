<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#010603"><title>CNIDARIA — Enter the Game</title>
<style>
:root{color-scheme:dark;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#010603;color:#bcffcf}canvas{position:fixed;inset:0;width:100%;height:100%;display:block}#scan{position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0 3px,#0003 4px 5px);opacity:.5}#shade{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 10%,#010603a0 90%)}main{position:relative;z-index:2;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}section{width:min(100%,480px);padding:28px 22px 30px;border:1px solid #1e6b3b;background:#010b07e8;box-shadow:0 0 90px #00e65b26,0 20px 70px #000b;border-radius:20px;backdrop-filter:blur(5px)}.status{font-size:11px;letter-spacing:.27em;color:#68df8c}.orb{width:112px;height:112px;margin:15px auto 24px;border:1px solid #4afe8b;border-radius:50%;display:grid;place-items:center;box-shadow:0 0 40px #00ff6b44,inset 0 0 25px #00ff6b22;animation:float 3.5s ease-in-out infinite}.orb span{font-size:43px;color:#7dffa3;text-shadow:0 0 25px #00ff66;animation:pulse 2.2s infinite}h1{font-size:clamp(36px,10vw,62px);margin:0;letter-spacing:.11em;text-shadow:0 0 22px #20ff7870}p{line-height:1.55;color:#8dcda5}a,button{display:block;width:100%;border:1px solid #5cff9b;border-radius:12px;padding:18px 14px;margin-top:14px;font:900 17px inherit;letter-spacing:.13em;text-decoration:none;cursor:pointer}a{background:#a3ffbd;color:#00250e;box-shadow:0 0 25px #00ff4a35}button{background:#062014;color:#b3ffce}button:focus-visible,a:focus-visible{outline:3px solid #fff;outline-offset:4px}#opts{display:none;margin-top:12px;padding:12px;border:1px solid #235b37;border-radius:10px}#opts.open{display:block}label{display:block;padding:10px}.foot{font-size:10px;letter-spacing:.12em;margin-top:24px}@keyframes float{50%{transform:translateY(-12px)}}@keyframes pulse{50%{opacity:.45}}@media(prefers-reduced-motion:reduce){.orb,.orb span{animation:none}}

/* Cinematic Natas awakening: no rain before the reveal. */
#rain{opacity:0;transition:opacity .7s ease}body.ready #rain{opacity:0}body.entering #rain{opacity:1}
#scan,#shade{z-index:1}section{position:relative;background:transparent;border-color:transparent;box-shadow:none;backdrop-filter:none;transition:opacity .4s ease}
.orb{transform:scale(.06);opacity:0;animation:awaken 4.2s ease-in-out forwards;filter:drop-shadow(0 0 14px #30ff80)}
.orb span{font-size:43px}h1,.status,section>p,.foot,#start,#options{opacity:0;animation:reveal .6s ease-out 4.3s forwards}
#skip{position:fixed;right:16px;top:calc(14px + env(safe-area-inset-top));z-index:8;width:auto;padding:10px 14px;font-size:12px;background:#001a0bda;border:1px solid #387b4e;opacity:1;animation:none}
#transition{position:fixed;inset:0;z-index:7;pointer-events:none;opacity:0;background:radial-gradient(circle,#28ff7a2b,#000 80%);transition:opacity .5s ease}
body.entering #transition{opacity:1}
body.entering section{opacity:0}
@keyframes awaken{0%{transform:scale(.03) translateY(40px);opacity:0}8%{opacity:.9;transform:scale(.13)}13%{opacity:.2;transform:scale(.06)}20%{opacity:1;transform:scale(.2)}25%{opacity:.3;transform:scale(.11)}33%{opacity:1;transform:scale(.32)}39%{transform:scale(.23)}47%{transform:scale(.53) translateY(10px)}64%{transform:scale(.8)}82%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
@keyframes reveal{to{opacity:1}}
@media(prefers-reduced-motion:reduce){.orb,h1,.status,section>p,.foot,#start,#options{animation:none;opacity:1;transform:none}#rain{display:none}}
/* Abyss-first sequence: ominous accelerated pulses, then friendly reveal */
body{background:#000}#rain{background:#000}
.orb{width:142px;height:142px;border-color:#48ff8b;box-shadow:0 0 34px #1eff6730,inset 0 0 26px #1eff6725;animation:deepPulse 6.8s cubic-bezier(.2,.1,.3,1) both}
.orb span{font-size:64px;filter:blur(5px);animation:creatureFocus 6.8s ease both}
section{padding-top:30px}h1{font-size:clamp(30px,9vw,54px)}
section>p,.status,.foot{display:none}
h1,#start,#options{animation:reveal .55s ease-out 6.9s both}
@keyframes deepPulse{
0%{opacity:0;transform:translateY(90px) scale(.02);filter:blur(20px)}
12%{opacity:.42;transform:translateY(75px) scale(.10);filter:blur(15px)}
16%{opacity:.08;transform:translateY(75px) scale(.055);filter:blur(17px)}
28%{opacity:.58;transform:translateY(60px) scale(.21);filter:blur(12px)}
32%{opacity:.12;transform:translateY(60px) scale(.13);filter:blur(15px)}
42%{opacity:.68;transform:translateY(42px) scale(.35);filter:blur(9px)}
46%{opacity:.18;transform:translateY(42px) scale(.25);filter:blur(12px)}
55%{opacity:.8;transform:translateY(25px) scale(.53);filter:blur(7px)}
59%{opacity:.32;transform:translateY(25px) scale(.42);filter:blur(9px)}
69%{opacity:1;transform:translateY(8px) scale(.78);filter:blur(4px)}
75%{opacity:.64;transform:translateY(8px) scale(.70);filter:blur(5px)}
88%{opacity:1;transform:translateY(-8px) scale(1.08);filter:blur(0)}
100%{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}
}
@keyframes creatureFocus{0%,65%{opacity:.25;filter:blur(9px)}90%,100%{opacity:1;filter:blur(0)}}
@media(prefers-reduced-motion:reduce){.orb,.orb span,h1,#start,#options{animation:none;opacity:1;transform:none;filter:none}}

.natas-creature{width:120px;height:130px;overflow:visible;filter:drop-shadow(0 0 14px #22ff7788);animation:creatureFocus 4.4s ease both}
.natas-creature .face{opacity:0;animation:reveal .4s ease 6.3s forwards}
.natas-creature .tentacles{transform-origin:80px 99px;animation:drift 2.6s ease-in-out infinite alternate}
@keyframes drift{to{transform:rotate(7deg) translateX(3px)}}
.orb{border:0;box-shadow:0 0 60px #00ff6620,inset 0 0 30px #00ff6612}
@media(prefers-reduced-motion:reduce){.natas-creature,.natas-creature .face,.natas-creature .tentacles{animation:none;opacity:1}}

/* Game appears behind a dissolving digital veil after START */
#game-preview{position:fixed;inset:0;width:100%;height:100%;border:0;z-index:0;opacity:0;pointer-events:none;background:#000;transition:opacity .7s ease .45s}
body.entering #game-preview{opacity:1;z-index:4}
body.entering #rain{z-index:5;opacity:1;animation:rainDissolve 2.1s ease-in forwards}
body.entering #shade,body.entering #scan{opacity:0;transition:opacity .4s}
body.entering #transition{opacity:0}
body.entering #skip{display:none}
@keyframes rainDissolve{0%{opacity:0}30%{opacity:.95}62%{opacity:.8}100%{opacity:0}}

/* The original repository coffee emblem turns into Natas; his eyes are the surprise. */
.natas-flip{position:relative;width:132px;height:150px;transform-style:preserve-3d;animation:natasTurn 8.4s ease-in-out both}
.natas-flip>svg,.natas-flip>img{position:absolute;inset:0;width:100%;height:100%;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.natas-flip .natas-coffee{object-fit:contain;filter:drop-shadow(0 0 10px #42ff8b88)}
.natas-flip .natas-creature{transform:rotateY(180deg);animation:none}
.natas-flip .natas-creature .face{animation:reveal .4s ease 7.5s forwards}
@keyframes natasTurn{0%,66%{transform:rotateY(0)}73%{transform:rotateY(92deg) scale(.85)}84%,100%{transform:rotateY(180deg)}}
.orb{animation-duration:8.4s}
h1,#start,#options{animation-delay:8.4s}
@media(prefers-reduced-motion:reduce){.natas-flip{animation:none;transform:rotateY(180deg)}.natas-flip .natas-creature .face{animation:none;opacity:1}}
/* Keep the actual repository emblem as the front face of Natas. */
.natas-flip .natas-coffee{transform:translateZ(1px)}
@media(prefers-reduced-motion:reduce){.natas-flip .natas-coffee{visibility:hidden}}

/* Natas director's cut: handle on screen-right, head-over-heels flip, delayed eyes and wave. */
.natas-flip .natas-coffee{transform:scaleX(-1) translateZ(1px);filter:drop-shadow(0 0 8px #42ff8b99)}
.natas-flip .natas-creature{transform:rotateX(180deg);filter:drop-shadow(0 0 10px #33ff8a88)}
.natas-flip{animation:natasSomersault var(--intro-length,10.8s) cubic-bezier(.45,.05,.22,1) both}
.orb{animation-duration:var(--intro-length,10.8s)}
h1,#start,#options{animation-delay:var(--intro-length,10.8s)}
.natas-flip .natas-creature .face{opacity:0;animation:eyesOpen .55s ease calc(var(--intro-length,10.8s) * .90) both}
.natas-flip .natas-arm{transform-origin:120px 105px;animation:headScratch 1.1s ease-in-out calc(var(--intro-length,10.8s) * .91) 2 alternate both}
@keyframes natasSomersault{0%,68%{transform:rotateX(0)}76%{transform:rotateX(90deg) scale(.84)}88%,100%{transform:rotateX(180deg)}}
@keyframes eyesOpen{from{opacity:0;transform:scaleY(.08);transform-origin:80px 77px}to{opacity:1;transform:scaleY(1)}}
@keyframes headScratch{0%{transform:rotate(-12deg)}50%{transform:rotate(12deg)}100%{transform:rotate(-8deg)}}
body.short{--intro-length:5.8s}
body.long{--intro-length:10.8s}
@media(prefers-reduced-motion:reduce){.natas-flip{animation:none;transform:rotateX(180deg)}.natas-flip .natas-creature .face,.natas-flip .natas-arm{animation:none;opacity:1}}

/* Director feedback: resolve the logo completely BEFORE the vertical reveal. */
.orb{animation:clearApproach var(--intro-length,10.8s) ease-out both;filter:none!important;background:none!important;box-shadow:none!important}
.natas-flip{filter:none!important}
.natas-flip .natas-coffee{filter:none!important;image-rendering:auto}
.natas-flip .natas-creature{filter:none!important}
@keyframes clearApproach{
0%{opacity:0;transform:translateY(72px) scale(.10);filter:blur(10px)}
14%{opacity:.2;transform:translateY(60px) scale(.2)}
26%{opacity:.5;transform:translateY(45px) scale(.4)}
40%{opacity:.85;transform:translateY(18px) scale(.75)}
53%,100%{opacity:1;transform:translateY(0) scale(1)}
}
.natas-flip .natas-coffee{backface-visibility:hidden}
.natas-flip .natas-creature{backface-visibility:hidden}
@media(prefers-reduced-motion:reduce){.orb{animation:none;opacity:1;transform:none}}
/* Natas is now a freeform squid silhouette, never a green card or square. */
.natas-flip .natas-creature{overflow:visible!important}
.natas-flip .natas-creature .face{transform-box:fill-box;transform-origin:center}
.natas-flip .natas-arm{transform-box:view-box}
@media(prefers-reduced-motion:reduce){.natas-flip .natas-creature .face{opacity:1}}
/* Final title polish: stable 3D compositing, proper motion accessibility and focus. */
.natas-flip{will-change:transform;perspective:700px}
.natas-flip>img,.natas-flip>svg{-webkit-transform-style:preserve-3d;transform-style:preserve-3d}
body.entering main{pointer-events:none}
body.entering #game-preview{transition:opacity 1.25s ease .1s}
@media(prefers-reduced-motion:reduce){.natas-flip .natas-arm,.natas-flip .tentacles{animation:none!important}.natas-flip .face{opacity:1!important}}
</style></head><body><iframe allow="accelerometer; gyroscope; magnetometer; fullscreen" id="game-preview" title="CNIDARIA game preview" loading="lazy" tabindex="-1" aria-hidden="true"></iframe><canvas id="rain" aria-hidden="true"></canvas><div id="shade"></div><div id="scan"></div><button id="skip" type="button">SKIP INTRO ›</button><div id="transition"></div><main><section><div class="status">● SYSTEM ONLINE · V 1.0</div><div class="orb" aria-hidden="true"><div class="natas-flip"><img class="natas-coffee" src="./assets/cnidaria-original-logo.svg" alt="Original CNIDARIA logo"><svg class="natas-creature" viewBox="0 0 160 180" role="img" aria-label="Natas the friendly squid, waving hello"><defs><linearGradient id="natasSkin" x1="0" y1="0" x2=".85" y2="1"><stop stop-color="#e7fff0"/><stop offset=".48" stop-color="#89f5ba"/><stop offset="1" stop-color="#20ba72"/></linearGradient></defs><g class="tentacles" fill="none" stroke="#64e9a3" stroke-width="8" stroke-linecap="round"><path d="M48 110 Q35 130 45 148 Q53 161 44 174"/><path d="M67 114 Q57 140 68 156 Q74 168 67 177"/><path d="M93 114 Q103 140 93 156 Q87 168 97 177"/><path d="M111 110 Q125 133 113 151 Q107 165 119 174"/></g><path d="M80 13 C55 13 30 42 22 91 Q19 106 37 110 Q49 113 59 105 Q69 116 80 108 Q91 116 102 105 Q114 113 126 110 Q141 107 138 91 C130 42 105 13 80 13Z" fill="url(#natasSkin)" stroke="#b9ffdb" stroke-width="2.5"/><path d="M42 52 Q80 27 118 52" stroke="#f3fff5" stroke-width="5" stroke-linecap="round" fill="none" opacity=".35"/><g class="face"><ellipse cx="59" cy="79" rx="10" ry="13" fill="#073c29"/><ellipse cx="101" cy="79" rx="10" ry="13" fill="#073c29"/><circle cx="62" cy="74" r="3.5" fill="white"/><circle cx="104" cy="74" r="3.5" fill="white"/><path d="M72 94 Q80 102 88 94" fill="none" stroke="#0b5136" stroke-width="3.5" stroke-linecap="round"/><ellipse cx="43" cy="94" rx="8" ry="4" fill="#ef93ad" opacity=".6"/><ellipse cx="117" cy="94" rx="8" ry="4" fill="#ef93ad" opacity=".6"/></g><g class="natas-arm" fill="none" stroke="#56d994" stroke-width="9" stroke-linecap="round"><path d="M121 108 Q148 95 138 65 Q132 53 119 51"/><path d="M119 51 L112 44 M119 51 L124 40"/></g></svg></div></div><h1>CNIDARIA</h1><p>THE GAUNTLET AWAITS.<br>THROW. CATCH. CHALLENGE.</p><a id="start" href="./index.html?play=1">▶ START GAME</a><button id="options" type="button" aria-expanded="false">⚙ OPTIONS</button><div id="opts"><label><input id="motion" type="checkbox"> Reduce animation</label><p>Direct challenge and invitation links still open immediately.</p></div><p class="foot">PRESS START TO ENTER THE GAME</p></section></main>
<script>
(()=>{const mode=new URLSearchParams(location.search).get('intro');const returning=sessionStorage.getItem('cnidaria-intro-seen')==='1';const short=mode==='short'||(mode!=='long'&&returning);document.body.classList.add(short?'short':'long');const c=document.getElementById('rain'),ctx=c.getContext('2d');let cols=[],width=0,height=0,last=0,frame=0;const reduce=document.getElementById('motion');reduce.checked=matchMedia('(prefers-reduced-motion: reduce)').matches;const resize=()=>{width=innerWidth;height=innerHeight;const d=Math.min(devicePixelRatio||1,1.5);c.width=Math.round(width*d);c.height=Math.round(height*d);ctx.setTransform(d,0,0,d,0,0);cols=Array.from({length:Math.ceil(width/18)},()=>Math.random()*height/18)};const draw=t=>{frame=requestAnimationFrame(draw);if(reduce.checked||!document.body.classList.contains("ready")||t-last<55)return;last=t;ctx.fillStyle='rgba(1,6,3,.12)';ctx.fillRect(0,0,width,height);ctx.font='15px monospace';for(let i=0;i<cols.length;i++){ctx.fillStyle=Math.random()>.94?'#bdffd2':'#20b957';ctx.fillText('01CNIDARIA'[Math.floor(Math.random()*10)],i*18,cols[i]*18);cols[i]=cols[i]*18>height&&Math.random()>.96?0:cols[i]+.42+Math.random()*.45}};resize();addEventListener('resize',resize,{passive:true});frame=requestAnimationFrame(draw);reduce.addEventListener('change',()=>{if(reduce.checked)ctx.clearRect(0,0,width,height)});const destination='./index.html?play=1';
const preview=document.getElementById('game-preview');
const skip=document.getElementById('skip');
skip.setAttribute('aria-label','Skip cinematic introduction and open the game immediately');
let previewLoaded=false;
preview.addEventListener('load',()=>{previewLoaded=true});
const enter=()=>{if(document.body.classList.contains('entering'))return;sessionStorage.setItem('cnidaria-intro-seen','1');if(reduce.checked){location.replace(destination);return}
document.body.classList.add('ready','entering');
const start=document.getElementById('start');start.setAttribute('aria-disabled','true');start.style.pointerEvents='none';
if(!preview.src||preview.src==='about:blank')preview.src=destination;
setTimeout(()=>{if(!previewLoaded){location.replace(destination);return}preview.style.pointerEvents='auto';document.getElementById('rain').style.display='none';document.getElementById('transition').style.display='none';document.querySelector('main').style.display='none';document.getElementById('shade').style.display='none';document.getElementById('scan').style.display='none';preview.removeAttribute('aria-hidden');preview.removeAttribute('tabindex');preview.focus()},2100)};
const warmPreview=()=>{if(!preview.getAttribute('src'))preview.src=destination};
setTimeout(warmPreview,short?2500:5400);
skip.addEventListener('click',()=>{sessionStorage.setItem('cnidaria-intro-seen','1');location.replace(destination)});
document.getElementById('start').addEventListener('click',e=>{e.preventDefault();enter()});
if(reduce.checked){document.body.classList.add('ready');document.getElementById('skip').hidden=true}
else setTimeout(()=>{document.getElementById('skip').textContent='SKIP ›'},short?5800:10800);
document.getElementById('options').addEventListener('click',()=>{const p=document.getElementById('opts');p.classList.toggle('open');document.getElementById('options').setAttribute('aria-expanded',String(p.classList.contains('open')))});})();
</script></body></html>
