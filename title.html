<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#010603"><title>CNIDARIA — Enter the Game</title>
<style>
:root{color-scheme:dark;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#010603;color:#bcffcf}canvas{position:fixed;inset:0;width:100%;height:100%;display:block}#scan{position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0 3px,#0003 4px 5px);opacity:.5}#shade{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 10%,#010603a0 90%)}main{position:relative;z-index:2;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}section{width:min(100%,480px);padding:28px 22px 30px;border:1px solid #1e6b3b;background:#010b07e8;box-shadow:0 0 90px #00e65b26,0 20px 70px #000b;border-radius:20px;backdrop-filter:blur(5px)}.status{font-size:11px;letter-spacing:.27em;color:#68df8c}.orb{width:112px;height:112px;margin:15px auto 24px;border:1px solid #4afe8b;border-radius:50%;display:grid;place-items:center;box-shadow:0 0 40px #00ff6b44,inset 0 0 25px #00ff6b22;animation:float 3.5s ease-in-out infinite}.orb span{font-size:43px;color:#7dffa3;text-shadow:0 0 25px #00ff66;animation:pulse 2.2s infinite}h1{font-size:clamp(36px,10vw,62px);margin:0;letter-spacing:.11em;text-shadow:0 0 22px #20ff7870}p{line-height:1.55;color:#8dcda5}a,button{display:block;width:100%;border:1px solid #5cff9b;border-radius:12px;padding:18px 14px;margin-top:14px;font:900 17px inherit;letter-spacing:.13em;text-decoration:none;cursor:pointer}a{background:#a3ffbd;color:#00250e;box-shadow:0 0 25px #00ff4a35}button{background:#062014;color:#b3ffce}button:focus-visible,a:focus-visible{outline:3px solid #fff;outline-offset:4px}#opts{display:none;margin-top:12px;padding:12px;border:1px solid #235b37;border-radius:10px}#opts.open{display:block}label{display:block;padding:10px}.foot{font-size:10px;letter-spacing:.12em;margin-top:24px}@keyframes float{50%{transform:translateY(-12px)}}@keyframes pulse{50%{opacity:.45}}@media(prefers-reduced-motion:reduce){.orb,.orb span{animation:none}}
</style></head><body><canvas id="rain" aria-hidden="true"></canvas><div id="shade"></div><div id="scan"></div><main><section><div class="status">● SYSTEM ONLINE · V 1.0</div><div class="orb" aria-hidden="true"><span>⌁</span></div><h1>CNIDARIA</h1><p>THE GAUNTLET AWAITS.<br>THROW. CATCH. CHALLENGE.</p><a id="start" href="./index.html?play=1">▶ START GAME</a><button id="options" type="button" aria-expanded="false">⚙ OPTIONS</button><div id="opts"><label><input id="motion" type="checkbox"> Reduce animation</label><p>Direct challenge and invitation links still open immediately.</p></div><p class="foot">PRESS START TO ENTER THE GAME</p></section></main>
<script>
(()=>{const c=document.getElementById('rain'),ctx=c.getContext('2d');let cols=[],width=0,height=0,last=0,frame=0;const reduce=document.getElementById('motion');reduce.checked=matchMedia('(prefers-reduced-motion: reduce)').matches;const resize=()=>{width=innerWidth;height=innerHeight;const d=Math.min(devicePixelRatio||1,1.5);c.width=Math.round(width*d);c.height=Math.round(height*d);ctx.setTransform(d,0,0,d,0,0);cols=Array.from({length:Math.ceil(width/18)},()=>Math.random()*height/18)};const draw=t=>{frame=requestAnimationFrame(draw);if(reduce.checked||t-last<55)return;last=t;ctx.fillStyle='rgba(1,6,3,.12)';ctx.fillRect(0,0,width,height);ctx.font='15px monospace';for(let i=0;i<cols.length;i++){ctx.fillStyle=Math.random()>.94?'#bdffd2':'#20b957';ctx.fillText('01CNIDARIA'[Math.floor(Math.random()*10)],i*18,cols[i]*18);cols[i]=cols[i]*18>height&&Math.random()>.96?0:cols[i]+.42+Math.random()*.45}};resize();addEventListener('resize',resize,{passive:true});frame=requestAnimationFrame(draw);reduce.addEventListener('change',()=>{if(reduce.checked)ctx.clearRect(0,0,width,height)});document.getElementById('options').addEventListener('click',()=>{const p=document.getElementById('opts');p.classList.toggle('open');document.getElementById('options').setAttribute('aria-expanded',String(p.classList.contains('open')))});})();
</script></body></html>
