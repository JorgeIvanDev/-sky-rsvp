<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CNIDARIA RSVP Live Diagnostics</title><style>body{font:16px system-ui;background:#07160c;color:#b8ffc6;max-width:680px;margin:3rem auto;padding:1rem}button{background:#28f46e;color:#06150a;border:0;padding:1rem;border-radius:8px;font-weight:bold}pre{white-space:pre-wrap;line-height:1.8}a{color:#a4ffb7}</style></head><body><h1>CNIDARIA · LIVE RSVP DIAGNOSTICS</h1><p>Run a disposable end-to-end invitation test against the production RSVP function. This creates one clearly labeled test invitation and one test reply. The host secret stays in this page's memory and is never displayed.</p><button id="run">RUN LIVE TEST</button><pre id="out" aria-live="polite">Waiting for test.</pre><p><a href="./">Return to CNIDARIA</a></p><script>
const endpoint='https://hwkxuczipnaqzhbnaurw.supabase.co/functions/v1/cnidaria-rsvp';
const out=document.getElementById('out'),button=document.getElementById('run');
const log=(label,ok,detail='')=>out.textContent+=(ok?'PASS':'FAIL')+' · '+label+(detail?' · '+detail:'')+'\n';
async function api(body){const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),12000);try{const response=await fetch(endpoint,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body),signal:controller.signal});const result=await response.json();return {status:response.status,...result}}finally{clearTimeout(timeout)}}
button.onclick=async()=>{button.disabled=true;out.textContent='Running live tests…\n';try{
const created=await api({action:'create',title:'CNIDARIA automated RSVP smoke test'});
if(!created.inviteId||!created.hostSecret)throw Error('Create failed: '+JSON.stringify(created));log('Create invitation',true);
const inviteId=created.inviteId,hostSecret=created.hostSecret;
const denied=await api({action:'inbox',inviteId,hostSecret:'wrong-secret-not-authorized-000000000000000000000000000000000000'});
log('Wrong host secret denied',denied.status===401,'HTTP '+denied.status);
const key=crypto.randomUUID(),name='CNIDARIA Diagnostic Guest';
const first=await api({action:'reply',inviteId,name,choice:'yes',submissionKey:key});log('Submit YES',first.saved===true);
const repeat=await api({action:'reply',inviteId,name,choice:'yes',submissionKey:key});log('Idempotent repeat',repeat.saved===true&&repeat.alreadySaved===true);
const changed=await api({action:'reply',inviteId,name,choice:'maybe',submissionKey:key});log('Change YES to MAYBE',changed.saved===true&&changed.updated===true);
const inbox=await api({action:'inbox',inviteId,hostSecret});
log('Authorized private inbox',inbox.status===200&&Array.isArray(inbox.replies));
log('Updated RSVP visible in inbox',Array.isArray(inbox.replies)&&inbox.replies.some(r=>r.guest_name===name&&r.choice==='maybe'));
out.textContent+='\nFinished. Test invitation ID: '+inviteId+'\n';
}catch(e){log('Test interrupted',false,e.message)}finally{button.disabled=false}};
</script></body></html>
