<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>CNIDARIA Private RSVP Inbox</title><style>body{font-family:system-ui,sans-serif;background:#101b29;color:#fff;max-width:660px;margin:8px auto;padding:14px}h1{font-size:1.35rem;margin:8px 0 12px}p{margin:9px 0}#replies{padding-left:24px}#replies li{margin:7px 0;padding:11px}#summary{font-weight:700;margin:12px 0}#savedHosts details{border:1px solid #34445a;border-radius:9px;padding:10px;margin:10px 0}#savedHosts summary{cursor:pointer;font-weight:700}#savedHosts button{margin:8px 0 0!important}#toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}#toolbar button{font-size:.85rem;padding:10px}button{padding:14px;border:0;border-radius:8px;background:#18c9b3;color:#081522;font-weight:700;font-size:1rem}li{margin:12px 0;background:#233449;padding:15px;border-radius:9px}small{color:#aebbc9}#status{margin:8px 0;color:#aebbc9;font-size:.9rem}#meetingTitle{font-size:1.05rem;font-weight:750;margin:6px 0}#lastUpdated{display:block;margin:6px 0 12px}</style></head><body><h1>🔐 CNIDARIA · RSVP Inbox</h1><div id="meetingTitle"></div><small id="lastUpdated"></small><p id="status" role="status"></p><section id="summary"></section><ol id="replies"></ol><div id="toolbar"><button id="refresh">↻ Refresh</button><button id="clear">Lock</button><a href="./" style="color:#18c9b3">← Invitations</a></div><details id="savedHostsPanel"><summary style="cursor:pointer;margin:12px 0">📬 Switch meeting</summary><section id="savedHosts"></section></details><small>Private link required. Replies refresh every 30 seconds while open.</small><section id="unused" hidden></section><script>
const API='https://hwkxuczipnaqzhbnaurw.supabase.co/functions/v1/cnidaria-rsvp';let inviteId='',secret='',inboxRequest=0,activeLoad=false;const status=document.getElementById('status');const list=document.getElementById('replies');const summary=document.getElementById('summary');function lock(){inboxRequest++;activeLoad=false;document.getElementById('meetingTitle').textContent='';document.getElementById('lastUpdated').textContent='';inviteId='';secret='';try{sessionStorage.removeItem('cnidariaHostSession')}catch{}history.replaceState(null,'',location.pathname);list.replaceChildren();summary.textContent='';status.textContent='Dashboard locked. Reopen your private host link to view replies.'}document.getElementById('clear').onclick=lock;
try{const match=decodeURIComponent(location.hash.slice(1)).match(/^host=([0-9a-f-]{36})\.([0-9a-f-]{72})$/i);if(match){inviteId=match[1];secret=match[2];try{sessionStorage.setItem('cnidariaHostSession',JSON.stringify({inviteId,secret}))}catch{}history.replaceState(null,'',location.pathname);status.textContent='Ready to load private responses.'}else {let saved=null;try{saved=JSON.parse(sessionStorage.getItem('cnidariaHostSession')||'null')}catch{}if(saved&&/^[0-9a-f-]{36}$/i.test(saved.inviteId)&&/^[0-9a-f-]{72}$/i.test(saved.secret)){inviteId=saved.inviteId;secret=saved.secret;status.textContent='Host session restored for this tab.'}else status.textContent='Open the private host dashboard link from your recent invitations.'}}catch{status.textContent='Invalid private link.'}
function showSavedHosts(){const area=document.getElementById('savedHosts');area.replaceChildren();let entries=[];try{entries=JSON.parse(localStorage.getItem('cnidariaSentInvites')||'[]')}catch{}if(!Array.isArray(entries))return;const eligible=entries.filter(x=>x&&typeof x.hostUrl==='string'&&new URL(x.hostUrl).origin===location.origin&&/^#host=[0-9a-f-]{36}\.[0-9a-f-]{72}$/i.test(new URL(x.hostUrl).hash));if(!eligible.length)return;const current=eligible.find(x=>new URL(x.hostUrl).hash.includes(inviteId+'.'));if(current)document.getElementById('meetingTitle').textContent=String(current.title||'Invitation').slice(0,90);const heading=document.createElement('strong');heading.textContent='YOUR SAVED DASHBOARDS';area.append(heading);for(const item of eligible.slice(0,12)){const button=document.createElement('button');button.style.cssText='display:block;margin:8px 0;width:100%;text-align:left;background:#243b50;color:#fff';button.textContent='📬 '+String(item.title||'Invitation').slice(0,90);button.onclick=()=>{const match=new URL(item.hostUrl).hash.match(/^#host=([0-9a-f-]{36})\.([0-9a-f-]{72})$/i);if(!match)return;inviteId=match[1];secret=match[2];inboxRequest++;activeLoad=false;document.getElementById('meetingTitle').textContent=String(item.title||'Invitation').slice(0,90);document.getElementById('lastUpdated').textContent='';list.replaceChildren();summary.textContent='';try{sessionStorage.setItem('cnidariaHostSession',JSON.stringify({inviteId,secret}))}catch{}load()};area.append(button)}}showSavedHosts();
async function load(){if(!inviteId||!secret){status.textContent='Private host link required.';return}if(activeLoad)return;activeLoad=true;const request=++inboxRequest;const requestedInvite=inviteId;if(!list.children.length)status.textContent='Loading…';try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'inbox',inviteId,hostSecret:secret})});const data=await r.json();if(request!==inboxRequest||requestedInvite!==inviteId)return;if(!r.ok)throw Error(data.error||'Server error');list.replaceChildren();const replies=data.replies||[];const unique=new Map();for(const item of [...replies].reverse()){const key=String(item.guest_name||'Guest').trim().toLocaleLowerCase();unique.set(key,item)}const guests=[...unique.values()].reverse();const counts={yes:0,maybe:0,no:0};for(const item of guests){counts[item.choice]=(counts[item.choice]||0)+1;const li=document.createElement('li');const name=document.createElement('strong');name.textContent=item.guest_name||'Guest';const detail=document.createElement('div');detail.textContent=({yes:'YES',maybe:'MAYBE',no:'NO'})[item.choice]+' · '+new Date(item.created_at).toLocaleString();li.append(name,detail);list.append(li)}summary.textContent='Yes: '+counts.yes+' · Maybe: '+counts.maybe+' · No: '+counts.no;document.getElementById('lastUpdated').textContent='Updated '+new Date().toLocaleTimeString();status.textContent=guests.length+' guest(s) responded'+(replies.length>guests.length?' · '+(replies.length-guests.length)+' repeat submission(s) grouped':'')+'.'}catch(e){if(request!==inboxRequest||requestedInvite!==inviteId)return;list.replaceChildren();summary.textContent='';status.textContent='Unable to refresh: '+e.message}finally{if(request===inboxRequest)activeLoad=false}}
document.getElementById('refresh').onclick=load;if(inviteId)load();setInterval(()=>{if(inviteId&&secret&&document.visibilityState==='visible')load()},30000);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&inviteId&&secret)load()});
</script></body></html>
