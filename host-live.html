<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="theme-color" content="#0b1b10"><title>CNIDARIA Private RSVP Inbox</title><style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif}*{box-sizing:border-box}body{background:radial-gradient(ellipse at 50% -10%,#254a58 0%,#101b29 55%);color:#f4fbff;max-width:700px;min-height:100vh;margin:auto;padding:clamp(16px,4vw,30px)}h1{font-size:clamp(1.2rem,4vw,1.55rem);letter-spacing:.02em;margin:8px 0 18px}#meetingTitle{font-size:clamp(1.2rem,5vw,1.7rem);font-weight:800;overflow-wrap:anywhere}#lastUpdated{display:block;margin:7px 0 16px}#status{font-size:.9rem;color:#b5c7d5;margin:10px 0 14px}small{color:#aebfc9}#summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin:14px 0 20px}.stat{border:1px solid #3b5061;border-radius:16px;padding:15px 8px;text-align:center;background:#203247}.stat strong{display:block;font-size:clamp(1.7rem,7vw,2.3rem);line-height:1.1}.stat span{font-size:.78rem;font-weight:750;letter-spacing:.08em}.stat.yes strong{color:#54e0b6}.stat.maybe strong{color:#ffd582}.stat.no strong{color:#ff9a9a}#replies{list-style:none;padding:0;margin:12px 0 18px;display:grid;gap:9px}#replies li{background:#203247;border:1px solid #354e60;border-radius:14px;padding:15px;display:flex;justify-content:space-between;align-items:center;gap:12px}#replies li strong{font-size:1rem;overflow-wrap:anywhere}#replies li div{color:#b9cbd7;font-size:.82rem;text-align:right}#toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin:18px 0}button{cursor:pointer;padding:12px 16px;min-height:44px;border:0;border-radius:11px;background:#35d5bd;color:#071c27;font-weight:800;font-size:.9rem}button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid #ffe3a0;outline-offset:3px}#toolbar a{color:#69e9d3;font-size:.88rem;font-weight:700;text-decoration:none}#savedHostsPanel{border:1px solid #354e60;border-radius:14px;padding:12px 15px;background:#182a3c;margin:16px 0}#savedHostsPanel>summary{cursor:pointer;font-weight:750;padding:4px 0}#savedHosts button{display:block;width:100%;margin:8px 0;text-align:left;background:#2a4357;color:#fff}#savedHosts strong{display:block;margin:15px 0 8px;font-size:.75rem;color:#b9cbd7}body>small:last-of-type{display:block;line-height:1.5;margin:12px 0 20px}@media(max-width:420px){#replies li{align-items:flex-start;flex-direction:column}#replies li div{text-align:left}}

/* Neon Overdrive dashboard — compact and accessible */
:root{--acid:#b7ff23;--line:rgba(183,255,35,.28)}body{background:radial-gradient(ellipse at 50% -18%,#224b1b 0%,#102018 44%,#070d0d 90%);color:#f3ffe9}h1{color:var(--acid);text-shadow:0 0 18px rgba(183,255,35,.35)}#meetingTitle{color:#e4ffcb}#status,#lastUpdated{color:#b9cdb0}.stat{background:linear-gradient(145deg,#1a301c,#12231c);border-color:var(--line);box-shadow:inset 0 1px rgba(183,255,35,.08)}.stat.yes strong{color:#aaff37}.stat.maybe strong{color:#ffe088}.stat.no strong{color:#ff9292}#replies li{background:linear-gradient(130deg,#1a2c1f,#111e1c);border-color:var(--line)}#replies li div{color:#c6d7c1}button{background:linear-gradient(120deg,#c5ff3e,#86ed08);color:#0b1b06;box-shadow:0 4px 0 #3c6c13}button:active{transform:translateY(2px)}button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid #e5ff98;outline-offset:3px}#toolbar a{color:#b9ff5b!important}#savedHostsPanel{background:#13241b;border-color:var(--line)}#savedHostsPanel>summary{color:#d7ff9e}#savedHosts button{background:#24412a;color:#f0ffe8;border:1px solid var(--line);box-shadow:none}#savedHosts strong{color:#c2d4b8}@media(prefers-reduced-motion:reduce){button:active{transform:none}}
</style></head><body><h1>🔐 CNIDARIA · RSVP Inbox</h1><div id="meetingTitle"></div><small id="lastUpdated"></small><p id="status" role="status"></p><section id="summary"></section><ol id="replies"></ol><div id="toolbar"><button id="refresh">↻ Refresh</button><button id="clear">Lock</button><a href="./" style="color:#18c9b3">← Invitations</a></div><details id="savedHostsPanel"><summary style="cursor:pointer;margin:12px 0">📬 Switch meeting</summary><section id="savedHosts"></section></details><small>Private link required. Replies refresh every 30 seconds while open.</small><section id="unused" hidden></section><script>
const API='https://hwkxuczipnaqzhbnaurw.supabase.co/functions/v1/cnidaria-rsvp';let inviteId='',secret='',inboxRequest=0,activeLoad=false;const status=document.getElementById('status');const list=document.getElementById('replies');const summary=document.getElementById('summary');function lock(){inboxRequest++;activeLoad=false;document.getElementById('meetingTitle').textContent='';document.getElementById('lastUpdated').textContent='';inviteId='';secret='';try{sessionStorage.removeItem('cnidariaHostSession')}catch{}history.replaceState(null,'',location.pathname);list.replaceChildren();summary.textContent='';status.textContent='Dashboard locked. Reopen your private host link to view replies.'}document.getElementById('clear').onclick=lock;
try{const match=decodeURIComponent(location.hash.slice(1)).match(/^host=([0-9a-f-]{36})\.([0-9a-f-]{72})$/i);if(match){inviteId=match[1];secret=match[2];try{sessionStorage.setItem('cnidariaHostSession',JSON.stringify({inviteId,secret}))}catch{}history.replaceState(null,'',location.pathname);status.textContent='Ready to load private responses.'}else {let saved=null;try{saved=JSON.parse(sessionStorage.getItem('cnidariaHostSession')||'null')}catch{}if(saved&&/^[0-9a-f-]{36}$/i.test(saved.inviteId)&&/^[0-9a-f-]{72}$/i.test(saved.secret)){inviteId=saved.inviteId;secret=saved.secret;status.textContent='Host session restored for this tab.'}else status.textContent='Open the private host dashboard link from your recent invitations.'}}catch{status.textContent='Invalid private link.'}
function showSavedHosts(){const area=document.getElementById('savedHosts');area.replaceChildren();let entries=[];try{entries=JSON.parse(localStorage.getItem('cnidariaSentInvites')||'[]')}catch{}if(!Array.isArray(entries))return;const eligible=entries.filter(x=>{if(!x||typeof x.hostUrl!=='string')return false;try{const url=new URL(x.hostUrl);return url.origin===location.origin&&/^#host=[0-9a-f-]{36}\.[0-9a-f-]{72}$/i.test(url.hash)}catch{return false}});if(!eligible.length)return;const current=eligible.find(x=>new URL(x.hostUrl).hash.includes(inviteId+'.'));if(current)document.getElementById('meetingTitle').textContent=String(current.title||'Invitation').slice(0,90);const heading=document.createElement('strong');heading.textContent='YOUR SAVED DASHBOARDS';area.append(heading);for(const item of eligible.slice(0,12)){const button=document.createElement('button');button.style.cssText='display:block;margin:8px 0;width:100%;text-align:left;background:#243b50;color:#fff';button.textContent='📬 '+String(item.title||'Invitation').slice(0,90);button.onclick=()=>{const match=new URL(item.hostUrl).hash.match(/^#host=([0-9a-f-]{36})\.([0-9a-f-]{72})$/i);if(!match)return;inviteId=match[1];secret=match[2];inboxRequest++;activeLoad=false;document.getElementById('meetingTitle').textContent=String(item.title||'Invitation').slice(0,90);document.getElementById('lastUpdated').textContent='';list.replaceChildren();summary.textContent='';try{sessionStorage.setItem('cnidariaHostSession',JSON.stringify({inviteId,secret}))}catch{}load()};area.append(button)}}showSavedHosts();
async function load(){if(!inviteId||!secret){status.textContent='Private host link required.';return}if(activeLoad)return;activeLoad=true;const request=++inboxRequest;const requestedInvite=inviteId;if(!list.children.length)status.textContent='Loading…';try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'inbox',inviteId,hostSecret:secret})});const data=await r.json();if(request!==inboxRequest||requestedInvite!==inviteId)return;if(!r.ok)throw Error(data.error||'Server error');list.replaceChildren();const replies=data.replies||[];const unique=new Map();for(const item of [...replies].reverse()){const key=String(item.guest_name||'Guest').trim().toLocaleLowerCase();unique.set(key,item)}const guests=[...unique.values()].reverse();const counts={yes:0,maybe:0,no:0};for(const item of guests){counts[item.choice]=(counts[item.choice]||0)+1;const li=document.createElement('li');const name=document.createElement('strong');name.textContent=item.guest_name||'Guest';const detail=document.createElement('div');detail.textContent=({yes:'YES',maybe:'MAYBE',no:'NO'})[item.choice]+' · '+new Date(item.created_at).toLocaleString();li.append(name,detail);list.append(li)}summary.replaceChildren();for(const choice of ['yes','maybe','no']){const card=document.createElement('div');card.className='stat '+choice;const number=document.createElement('strong');number.textContent=counts[choice];const label=document.createElement('span');label.textContent=choice.toUpperCase();card.append(number,label);summary.append(card)}document.getElementById('lastUpdated').textContent='Updated '+new Date().toLocaleTimeString();status.textContent=guests.length+' guest(s) responded'+(replies.length>guests.length?' · '+(replies.length-guests.length)+' repeat submission(s) grouped':'')+'.'}catch(e){if(request!==inboxRequest||requestedInvite!==inviteId)return;list.replaceChildren();summary.textContent='';status.textContent='Unable to refresh: '+e.message}finally{if(request===inboxRequest)activeLoad=false}}
document.getElementById('refresh').onclick=load;if(inviteId)load();setInterval(()=>{if(inviteId&&secret&&document.visibilityState==='visible')load()},30000);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&inviteId&&secret)load()});
</script></body></html>
