<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>CNIDARIA Private RSVP Inbox</title><style>body{font-family:system-ui,sans-serif;background:#101b29;color:#fff;max-width:660px;margin:35px auto;padding:16px}h1{font-size:1.8rem}button{padding:14px;border:0;border-radius:8px;background:#18c9b3;color:#081522;font-weight:700;font-size:1rem}li{margin:12px 0;background:#233449;padding:15px;border-radius:9px}small{color:#aebbc9}#status{margin:20px 0}</style></head><body><h1>🔐 CNIDARIA — Private host inbox</h1><p>Only people with your private dashboard link can see these RSVPs. Keep this link secret.</p><button id="refresh">↻ REFRESH RESPONSES</button><small style="display:block;margin:10px 0">Responses refresh automatically every 30 seconds while this page is open.</small><button id="clear">LOCK DASHBOARD</button><p><a href="./" style="color:#18c9b3">← BACK TO INVITATIONS</a></p><p id="status" role="status"></p><section id="savedHosts" style="margin:14px 0"></section><section id="summary"></section><ol id="replies"></ol><script>
const API='https://hwkxuczipnaqzhbnaurw.supabase.co/functions/v1/cnidaria-rsvp';let inviteId='',secret='',inboxRequest=0;const status=document.getElementById('status');const list=document.getElementById('replies');const summary=document.getElementById('summary');function lock(){inboxRequest++;inviteId='';secret='';try{sessionStorage.removeItem('cnidariaHostSession')}catch{}history.replaceState(null,'',location.pathname);list.replaceChildren();summary.textContent='';status.textContent='Dashboard locked. Reopen your private host link to view replies.'}document.getElementById('clear').onclick=lock;
try{const match=decodeURIComponent(location.hash.slice(1)).match(/^host=([0-9a-f-]{36})\.([0-9a-f-]{72})$/i);if(match){inviteId=match[1];secret=match[2];try{sessionStorage.setItem('cnidariaHostSession',JSON.stringify({inviteId,secret}))}catch{}history.replaceState(null,'',location.pathname);status.textContent='Ready to load private responses.'}else {let saved=null;try{saved=JSON.parse(sessionStorage.getItem('cnidariaHostSession')||'null')}catch{}if(saved&&/^[0-9a-f-]{36}$/i.test(saved.inviteId)&&/^[0-9a-f-]{72}$/i.test(saved.secret)){inviteId=saved.inviteId;secret=saved.secret;status.textContent='Host session restored for this tab.'}else status.textContent='Open the private host dashboard link from your recent invitations.'}}catch{status.textContent='Invalid private link.'}
function showSavedHosts(){const area=document.getElementById('savedHosts');area.replaceChildren();let entries=[];try{entries=JSON.parse(localStorage.getItem('cnidariaSentInvites')||'[]')}catch{}if(!Array.isArray(entries))return;const eligible=entries.filter(x=>x&&typeof x.hostUrl==='string'&&new URL(x.hostUrl).origin===location.origin&&/^#host=[0-9a-f-]{36}\.[0-9a-f-]{72}$/i.test(new URL(x.hostUrl).hash));if(!eligible.length)return;const heading=document.createElement('strong');heading.textContent='YOUR SAVED DASHBOARDS';area.append(heading);for(const item of eligible.slice(0,12)){const button=document.createElement('button');button.style.cssText='display:block;margin:8px 0;width:100%;text-align:left;background:#243b50;color:#fff';button.textContent='📬 '+String(item.title||'Invitation').slice(0,90);button.onclick=()=>{const match=new URL(item.hostUrl).hash.match(/^#host=([0-9a-f-]{36})\.([0-9a-f-]{72})$/i);if(!match)return;inviteId=match[1];secret=match[2];inboxRequest++;list.replaceChildren();summary.textContent='';try{sessionStorage.setItem('cnidariaHostSession',JSON.stringify({inviteId,secret}))}catch{}load()};area.append(button)}}showSavedHosts();
async function load(){if(!inviteId||!secret){status.textContent='Private host link required.';return}const request=++inboxRequest;const requestedInvite=inviteId;status.textContent='Loading…';try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'inbox',inviteId,hostSecret:secret})});const data=await r.json();if(request!==inboxRequest||requestedInvite!==inviteId)return;if(!r.ok)throw Error(data.error||'Server error');list.replaceChildren();const replies=data.replies||[];const unique=new Map();for(const item of [...replies].reverse()){const key=String(item.guest_name||'Guest').trim().toLocaleLowerCase();unique.set(key,item)}const guests=[...unique.values()].reverse();const counts={yes:0,maybe:0,no:0};for(const item of guests){counts[item.choice]=(counts[item.choice]||0)+1;const li=document.createElement('li');const name=document.createElement('strong');name.textContent=item.guest_name||'Guest';const detail=document.createElement('div');detail.textContent=({yes:'YES',maybe:'MAYBE',no:'NO'})[item.choice]+' · '+new Date(item.created_at).toLocaleString();li.append(name,detail);list.append(li)}summary.textContent='Yes: '+counts.yes+' · Maybe: '+counts.maybe+' · No: '+counts.no;status.textContent=guests.length+' guest(s) responded'+(replies.length>guests.length?' · '+(replies.length-guests.length)+' repeat submission(s) grouped':'')+'.'}catch(e){if(request!==inboxRequest||requestedInvite!==inviteId)return;list.replaceChildren();summary.textContent='';status.textContent='Unable to load private inbox: '+e.message}}
document.getElementById('refresh').onclick=load;if(inviteId)load();setInterval(()=>{if(inviteId&&secret&&document.visibilityState==='visible')load()},30000);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&inviteId&&secret)load()});
</script></body></html>
