<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>CNIDARIA Private RSVP Inbox</title><style>body{font-family:system-ui,sans-serif;background:#101b29;color:#fff;max-width:660px;margin:35px auto;padding:16px}h1{font-size:1.8rem}button{padding:14px;border:0;border-radius:8px;background:#18c9b3;color:#081522;font-weight:700;font-size:1rem}li{margin:12px 0;background:#233449;padding:15px;border-radius:9px}small{color:#aebbc9}#status{margin:20px 0}</style></head><body><h1>🔐 CNIDARIA — Private host inbox</h1><p>Only people with your private dashboard link can see these RSVPs. Keep this link secret.</p><button id="refresh">REFRESH RESPONSES</button><button id="clear">LOCK DASHBOARD</button><p id="status" role="status"></p><section id="summary"></section><ol id="replies"></ol><script>
const API='https://hwkxuczipnaqzhbnaurw.supabase.co/functions/v1/cnidaria-rsvp';let inviteId='',secret='';const status=document.getElementById('status');const list=document.getElementById('replies');const summary=document.getElementById('summary');function lock(){inviteId='';secret='';history.replaceState(null,'',location.pathname);list.replaceChildren();summary.textContent='';status.textContent='Dashboard locked. Reopen your private host link to view replies.'}document.getElementById('clear').onclick=lock;
try{const match=decodeURIComponent(location.hash.slice(1)).match(/^host=([0-9a-f-]{36})\.([0-9a-f-]{72})$/i);if(match){inviteId=match[1];secret=match[2];history.replaceState(null,'',location.pathname);status.textContent='Ready to load private responses.'}else status.textContent='Open this page using the private host dashboard link generated when you create an invitation.'}catch{status.textContent='Invalid private link.'}
async function load(){if(!inviteId||!secret){status.textContent='Private host link required.';return}status.textContent='Loading…';try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'inbox',inviteId,hostSecret:secret})});const data=await r.json();if(!r.ok)throw Error(data.error||'Server error');list.replaceChildren();const replies=data.replies||[];const counts={yes:0,maybe:0,no:0};for(const item of replies){counts[item.choice]=(counts[item.choice]||0)+1;const li=document.createElement('li');const name=document.createElement('strong');name.textContent=item.guest_name||'Guest';const detail=document.createElement('div');detail.textContent=({yes:'YES',maybe:'MAYBE',no:'NO'})[item.choice]+' · '+new Date(item.created_at).toLocaleString();li.append(name,detail);list.append(li)}summary.textContent='Yes: '+counts.yes+' · Maybe: '+counts.maybe+' · No: '+counts.no;status.textContent=replies.length+' response(s) received.'}catch(e){list.replaceChildren();summary.textContent='';status.textContent='Unable to load private inbox: '+e.message}}
document.getElementById('refresh').onclick=load;if(inviteId)load();
</script></body></html>
