<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CNIDARIA · Multiplayer Beta</title><style>body{font:16px system-ui;background:#09232e;color:#eafff5;max-width:650px;margin:auto;padding:20px}section{background:#123944;border-radius:16px;padding:20px;margin:16px 0}input,button{font:inherit;padding:12px;border-radius:9px;margin:5px}input{background:#09232e;color:white;border:1px solid #5c8d87;max-width:95%}button{background:#7ce6b5;border:0;color:#05291f;font-weight:bold}small{color:#a5c9c0}a{color:#7ce6b5}li{margin:8px 0}</style></head><body><a href="./">← CNIDARIA</a><h1>🦑 Multiplayer Beta</h1><p>Authenticated meeting creation and owner-only live records. Invitations and cross-phone RSVP are not enabled yet.</p><section><h2>1. Sign in</h2><label>Email <input id="email" type="email" autocomplete="email"></label><button id="send">Send email code</button><p><label>6-digit email code <input id="otp" inputmode="numeric" maxlength="8"></label><button id="verify">Verify code</button></p><p id="identity">Not signed in</p><button id="logout">Sign out</button></section><section><h2>2. Create your meeting</h2><label>Title <input id="title" maxlength="100" placeholder="Coffee meetup"></label><label>Deadline <input id="deadline" type="datetime-local"></label><button id="create">Create authenticated meeting</button><small>Creating a meeting does not create an invitation or lock BSV.</small></section><section><h2>3. Your meetings</h2><button id="refresh">Refresh</button><ul id="meetings"></ul></section><p id="status" role="status"></p><script type="module">
const URL='https://hwkxuczipnaqzhbnaurw.supabase.co',KEY='sb_publishable_4qpeic_k8BJKdgQLoBlNsw_wrpP72Q_',store='cnidaria-multiplayer-session-v1';
const $=id=>document.getElementById(id);let session=null;try{session=JSON.parse(sessionStorage.getItem(store)||'null')}catch{}
function status(s){$('status').textContent=s}
async function api(path,{method='GET',body,auth=false}={}){const headers={'apikey':KEY,'Content-Type':'application/json'};if(auth){if(!session?.access_token)throw Error('Sign in first');headers.Authorization='Bearer '+session.access_token}const res=await fetch(URL+path,{method,headers,body:body?JSON.stringify(body):undefined});const data=await res.json().catch(()=>null);if(!res.ok)throw Error(data?.msg||data?.message||data?.error_description||'Request failed '+res.status);return data}
async function refresh(){if(!session)return;const user=await api('/auth/v1/user',{auth:true});$('identity').textContent='Signed in: '+(user.email||user.id);const rows=await api('/rest/v1/cnt_shared_meetings?select=id,title,status,deadline,created_at&order=created_at.desc&limit=25',{auth:true});$('meetings').replaceChildren();for(const r of rows){const li=document.createElement('li');li.textContent=r.title+' · '+r.status+' · '+new Date(r.deadline).toLocaleString();$('meetings').append(li)}if(!rows.length)$('meetings').textContent='No meetings yet'}
function run(fn){fn().catch(e=>status(e.message))}
$('send').onclick=()=>run(async()=>{const email=$('email').value.trim();if(!email)throw Error('Enter an email');await api('/auth/v1/otp',{method:'POST',body:{email,create_user:true}});status('Check your email for a sign-in code (if enabled in project settings).')});
$('verify').onclick=()=>run(async()=>{const email=$('email').value.trim(),token=$('otp').value.trim();if(!email||!token)throw Error('Email and code required');const result=await api('/auth/v1/verify',{method:'POST',body:{email,token,type:'email'}});if(!result.access_token)throw Error('No access token returned');session={access_token:result.access_token};sessionStorage.setItem(store,JSON.stringify(session));status('Signed in');await refresh()});
$('create').onclick=()=>run(async()=>{const user=await api('/auth/v1/user',{auth:true}),title=$('title').value.trim(),deadline=new Date($('deadline').value).toISOString();if(!title)throw Error('Enter a meeting title');const r=await api('/rest/v1/cnt_shared_meetings',{method:'POST',auth:true,body:{owner_id:user.id,title,deadline}});status('Meeting created (owner-only until invitation service is ready).');await refresh()});
$('refresh').onclick=()=>run(refresh);
$('logout').onclick=()=>{session=null;sessionStorage.removeItem(store);$('identity').textContent='Not signed in';$('meetings').replaceChildren();status('Signed out locally')};
$('deadline').value=new Date(Date.now()+3600000).toLocaleString('sv-SE').slice(0,16);if(session)run(refresh);
</script></body></html>
