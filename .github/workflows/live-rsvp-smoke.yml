name: Production RSVP vertical-slice smoke
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-rsvp-smoke.yml'
      - 'scripts/smoke-live-rsvp.mjs'
      - 'scripts/smoke-mobile-browser.mjs'
      - 'index.html'
      - 'host-live.html'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-rsvp:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify production create, unauthorized denial, reply, host inbox
        env:
          CNIDARIA_SMOKE_CONFIRM: 'YES'
        run: node scripts/smoke-live-rsvp.mjs
      - name: Install mobile browser test dependencies
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Verify deployed mobile host inbox receives named RSVPs
        env:
          CNIDARIA_SMOKE_CONFIRM: 'YES'
        run: node scripts/smoke-mobile-browser.mjs
