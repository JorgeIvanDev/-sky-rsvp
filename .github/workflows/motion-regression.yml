name: Motion regression tests
on:
  push:
    paths:
      - 'tests/motion-regression.js'
      - 'tests/engine-sanity.js'
      - 'tests/production-impact-replay.test.mjs'
      - 'tests/production-launch-replay.test.mjs'
      - 'tests/mobile-retry.test.mjs'
      - 'tests/mobile-trace-export.test.mjs'
      - 'tests/labeled-catch-replay.test.mjs'
      - 'tests/labeled-catch-examples.json'
      - 'cnidaria-motion-core.mjs'
      - 'cnidaria-motion-core.test.mjs'
      - 'index.html'
      - '.github/workflows/motion-regression.yml'
  pull_request:
    paths:
      - 'tests/motion-regression.js'
      - 'tests/engine-sanity.js'
      - 'tests/production-impact-replay.test.mjs'
      - 'tests/production-launch-replay.test.mjs'
      - 'tests/mobile-retry.test.mjs'
      - 'tests/mobile-trace-export.test.mjs'
      - 'tests/labeled-catch-replay.test.mjs'
      - 'tests/labeled-catch-examples.json'
      - 'cnidaria-motion-core.mjs'
      - 'cnidaria-motion-core.test.mjs'
      - 'index.html'
      - '.github/workflows/motion-regression.yml'
  workflow_dispatch:
jobs:
  motion-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run shared motion replay regression
        run: node --test cnidaria-motion-core.test.mjs
      - name: Run motion regression checks
        run: node tests/motion-regression.js
      - name: Check browser engine syntax and test alignment
        run: node tests/engine-sanity.js
      - name: Execute mobile retry and permission recovery regression
        run: node --test tests/mobile-retry.test.mjs
      - name: Exercise production mobile trace export recovery
        run: node --test tests/mobile-trace-export.test.mjs
      - name: Replay production launch and sensor-pause sequences
        run: node --test tests/production-launch-replay.test.mjs
      - name: Replay production post-impact sensor sequences
        run: node --test tests/production-impact-replay.test.mjs
      - name: Preserve user-labeled couch and hand evidence without synthetic sensor samples
        run: node --test tests/labeled-catch-replay.test.mjs
