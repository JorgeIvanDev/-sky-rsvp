name: Natas isolated read-tool tests
on:
  push:
    paths:
      - 'natas-read-tools.mjs'
      - 'natas-read-tools.test.mjs'
      - '.github/workflows/natas-read-tools.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node natas-read-tools.test.mjs
