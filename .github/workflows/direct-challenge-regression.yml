name: Direct challenge regression
on:
  push:
    paths: ['direct-challenge.html','gauntlet-history.test.mjs','cnidaria-motion-core.mjs','cnidaria-motion-core.test.mjs','gauntlet-sprint3.test.mjs','direct-challenge.test.mjs','tests/direct-challenge-oauth.test.mjs','tests/direct-challenge-creation.test.mjs','tests/direct-challenge-response.test.mjs','tests/direct-challenge-toss-confirmation.test.mjs','.github/workflows/direct-challenge-regression.yml']
  pull_request:
    paths: ['direct-challenge.html','direct-challenge.test.mjs','tests/direct-challenge-oauth.test.mjs','tests/direct-challenge-creation.test.mjs','tests/direct-challenge-response.test.mjs','tests/direct-challenge-toss-confirmation.test.mjs']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test gauntlet-history.test.mjs cnidaria-motion-core.test.mjs gauntlet-sprint3.test.mjs direct-challenge.test.mjs tests/direct-challenge-oauth.test.mjs tests/direct-challenge-creation.test.mjs tests/direct-challenge-response.test.mjs tests/direct-challenge-toss-confirmation.test.mjs
      - run: node tests/motion-regression.js
