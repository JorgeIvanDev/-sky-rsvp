name: Direct challenge regression
on:
  push:
    paths: ['direct-challenge.html','direct-challenge.test.mjs','.github/workflows/direct-challenge-regression.yml']
  pull_request:
    paths: ['direct-challenge.html','direct-challenge.test.mjs']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test direct-challenge.test.mjs
