name: RSVP security regression checks
on:
  push:
    paths:
      - 'rsvp/**'
      - 'supabase/**'
      - '.github/workflows/rsvp-security.yml'
  pull_request:
    paths:
      - 'rsvp/**'
      - 'supabase/**'
      - '.github/workflows/rsvp-security.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Challenge policy regression tests
        run: node --test --test-reporter=spec rsvp/challenge-policy.test.mjs
      - name: Atomic one-attempt challenge regression tests
        if: success() || failure()
        run: node --test --test-reporter=spec rsvp/atomic-challenge-*.test.mjs
      - name: All-migrations public grant regression tests
        if: success() || failure()
        run: node --test --test-reporter=spec rsvp/all-migrations-permissions.test.mjs
      - name: Direct RSVP payload security regression tests
        if: success() || failure()
        run: node --test --test-reporter=spec rsvp/rsvp-submit-policy.test.mjs
      - name: Private beta storage fail-closed regression tests
        if: success() || failure()
        run: node --test --test-reporter=spec rsvp/private-beta-schema-guard.test.mjs
      - name: RSVP SQL permissions regression tests
        if: success() || failure()
        run: node --test --test-reporter=spec rsvp/sql-security.test.mjs
      - name: Recipient and host authorization regression tests
        if: success() || failure()
        run: node --test --test-reporter=spec rsvp/recipient-authorization.test.mjs rsvp/host-inbox-authorization.test.mjs
      - name: Beta recipient revocation regression tests
        if: success() || failure()
        run: node --test --test-reporter=spec rsvp/beta-recipient-revocation.test.mjs

      - name: Internal atomic RSVP SQL structural regression tests
        if: success() || failure()
        run: node --test --test-reporter=spec rsvp/internal-atomic-rsvp-migration.test.mjs
      - name: Trusted-server RSVP handler security regression tests
        if: success() || failure()
        run: node --test --test-reporter=spec rsvp/private-rsvp-handler.test.mjs
      - name: Trusted host inbox handler security regression tests
        if: success() || failure()
        run: node --test --test-reporter=spec rsvp/private-host-inbox-handler.test.mjs
      - name: Trusted browser RSVP submission regression tests
        if: success() || failure()
        run: node --test --test-reporter=spec rsvp/trusted-client.test.mjs

      - name: Trusted browser host inbox regression tests
        if: success() || failure()
        run: node --test --test-reporter=spec rsvp/trusted-host-inbox-client.test.mjs rsvp/trusted-host-inbox-token.test.mjs

      - name: Trusted HTTP route bridge regression tests
        if: success() || failure()
        run: node --test --test-reporter=spec rsvp/trusted-http-router.test.mjs
      - name: Composed private event API end-to-end boundary tests
        if: success() || failure()
        run: node --test --test-reporter=spec rsvp/private-event-api.test.mjs

      - name: Node private API listener boundary tests
        if: success() || failure()
        run: node --test --test-reporter=spec rsvp/node-event-listener.test.mjs

      - name: Private PostgreSQL atomic writer regression tests
        if: success() || failure()
        run: node --test --test-reporter=spec rsvp/postgres-atomic-writer.test.mjs
      - name: Private PostgreSQL event API wiring tests
        if: success() || failure()
        run: node --test --test-reporter=spec rsvp/postgres-event-api.test.mjs

      - name: Private PostgreSQL host inbox reader tests
        if: success() || failure()
        run: node --test --test-reporter=spec rsvp/postgres-host-inbox-reader.test.mjs

      - name: Private host inbox SQL authorization tests
        if: success() || failure()
        run: node --test --test-reporter=spec rsvp/private-host-inbox-migration.test.mjs

      - name: Event room isolation and permissions regression tests
        if: success() || failure()
        run: node --test --test-reporter=spec rsvp/event-room-schema.test.mjs

      - name: Hall of Fame private ranking schema regression tests
        if: success() || failure()
        run: node --test --test-reporter=spec rsvp/hall-of-fame-schema.test.mjs

      - name: Atomic potluck ownership and access regression tests
        if: success() || failure()
        run: node --test --test-reporter=spec rsvp/potluck-claim-schema.test.mjs

      - name: Private event chat membership and permissions regression tests
        if: success() || failure()
        run: node --test --test-reporter=spec rsvp/event-chat-schema.test.mjs
