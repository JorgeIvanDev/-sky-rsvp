name: RSVP security regression checks
on:
  push:
    paths:
      - 'rsvp/**'
      - 'supabase/**'
      - '.github/workflows/rsvp-security.yml'
  pull_request:
    paths:
      - 'rsvp/**'
      - 'supabase/**'
      - '.github/workflows/rsvp-security.yml'
permissions:
  contents: read
jobs:
  security-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run RSVP security regression tests
        run: node --test rsvp/*.test.mjs
