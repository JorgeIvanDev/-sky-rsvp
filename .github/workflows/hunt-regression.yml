name: Hunt Mode regression
on:
  push:
    paths: ['hunt-*.mjs','hunt-mode.html','.github/workflows/hunt-regression.yml']
  pull_request:
    paths: ['hunt-*.mjs','hunt-mode.html','.github/workflows/hunt-regression.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test hunt-*.test.mjs
