name: Natas optional wallet-link security tests
on:
  push:
    paths:
      - 'natas-player-tools.mjs'
      - 'natas-player-tools.test.mjs'
      - 'natas-wallet-auth.mjs'
      - 'natas-wallet-auth.test.mjs'
      - 'natas-wallet-challenges.test.mjs'
      - 'supabase/migrations/20261112235000_natas_wallet_challenges.sql'
      - '.github/workflows/natas-wallet-auth.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node natas-wallet-auth.test.mjs
      - run: node natas-wallet-challenges.test.mjs
      - run: node natas-read-tools.test.mjs
      - run: node natas-player-tools.test.mjs
